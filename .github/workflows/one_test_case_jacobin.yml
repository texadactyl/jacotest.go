# Only on demand, this workflow will run the OpenJDK JVM against a single test case
# that is defined in "env:".

name: One Test Case - Jacobin

env:
  TEST_CASE: threading-runnable
  
on:
  workflow_dispatch:

jobs:

  run_jacobin:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@main
      with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: "**/go.sum"
          
    - name: Setup PATH
      shell: bash
      run: |
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Setup Jacobin
      shell: bash
      run: |
        git clone https://github.com/texadactyl/jacobin
        cd jacobin/src
        if [[ "$RUNNER_OS" == "Windows" ]]; then
            go build -o "$HOME/go/bin/jacobin.exe" .
        else
            go build -o "$HOME/go/bin/jacobin" .
        fi
        jacobin --version
        
    - name: Setup Jacotest
      shell: bash
      run: |
        cd src
        go get
        go install -v .
        cd ..
        jacotest -h

    - name: Setup JDK (NOT Windows on ARM64)
      if: >-
        !(runner.arch == 'ARM64' && runner.os == 'Windows')
      uses: actions/setup-java@main
      with:
        distribution: 'oracle'
        java-version: '21'

    - name: Setup JDK (Windows on ARM64 only)
      if: runner.arch == 'ARM64' && runner.os == 'Windows'
      uses: actions/setup-java@main
      with:
        distribution: 'microsoft'
        java-version: '21'
        
    - name: Run Test Cases POSIX
      shell: bash
      if: runner.os != 'Windows'
      run: |
        java --version
        javac --version
        set -x
        cd tests/HELPERS
        javac *.java
        ### Which test case?
        cd ../$TEST_CASE
        javac -cp ".:../HELPERS" main.java
        jacobin -cp ".:../HELPERS" main.class
   
    - name: Run Test Cases Windows
      shell: bash
      if: runner.os == 'Windows'
      run: |
        java --version
        javac --version
        set -x
        cd tests/HELPERS
        javac *.java
        ### Which test case?
        cd ../$TEST_CASE
        javac -cp ".;../HELPERS" main.java
        jacobin -cp ".;../HELPERS" main.class
