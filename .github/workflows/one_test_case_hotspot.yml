# Only on demand, this workflow will run https://github.com/texadactyl/jacobin against a single test case.
# that is defined in "env:".

name: One Test Case - Hotspot JVM

env:
  TEST_CASE: threading-runnable
  
on:
  workflow_dispatch:

jobs:

  run_hotspot:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v5
          
    - name: Setup JDK (NOT Windows on ARM64)
      if: >-
        !(runner.arch == 'ARM64' && runner.os == 'Windows')
      uses: actions/setup-java@main
      with:
        distribution: 'oracle'
        java-version: '21'

    - name: Setup JDK (Windows on ARM64 only)
      if: runner.arch == 'ARM64' && runner.os == 'Windows'
      uses: actions/setup-java@main
      with:
        distribution: 'microsoft'
        java-version: '21'
        
    - name: Run Test Case - Not Window
      shell: bash
      if: runner.os != 'Windows'
      run: |
        java --version
        javac --version
        set -x
        cd tests/HELPERS
        javac *.java
        cd ../$TEST_CASE
        javac -cp .:../HELPERS main.java
        java -cp .:../HELPERS main || true
   
    - name: Run Test Case - Windows
      shell: bash
      if: runner.os == 'Windows'
      run: |
        java --version
        javac --version
        set -x
        cd tests/HELPERS
        javac *.java
        cd ../$TEST_CASE
        javac -cp ".;../HELPERS" main.java
        java -cp ".;../HELPERS" main
